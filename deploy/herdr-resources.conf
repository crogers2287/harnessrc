# Install as ~/.config/systemd/user/herdr-server.service.d/relay-resources.conf
# This affects the next Herdr start and its future descendants. It does not
# shrink existing pools. Keep the service's existing TasksMax and restart policy.
[Service]
TasksAccounting=yes
Environment=TOKIO_WORKER_THREADS=2
Environment=RAYON_NUM_THREADS=4
Environment=GOMAXPROCS=4
Environment=OMP_NUM_THREADS=1
Environment=OPENBLAS_NUM_THREADS=1
Environment=MKL_NUM_THREADS=1
Environment=NUMEXPR_NUM_THREADS=1
Environment=TOKENIZERS_PARALLELISM=false
